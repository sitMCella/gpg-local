name: gpg-core

on:
  pull_request:
    paths:
      - 'crates/gpg-core/**'
      - '.github/workflows/gpg-core.yml'

defaults:
  run:
    working-directory: crates/gpg-core

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: crates/gpg-core -> target

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: No Tauri in the dependency graph
        run: |
          if cargo tree --locked | grep -i tauri; then
            echo "gpg-core must not depend on any tauri crate"
            exit 1
          fi

  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: crates/gpg-core -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build for arm64-v8a
        # ubuntu-22.04 runners ship an Android NDK and export ANDROID_NDK_LATEST_HOME.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a build --release --locked
