name: gpg-core

on:
  pull_request:
    paths:
      - 'crates/gpg-core/**'
      - 'crates/gpg-core-ffi/**'
      - '.github/workflows/gpg-core.yml'

defaults:
  run:
    working-directory: crates/gpg-core

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: crates/gpg-core -> target

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: No Tauri in the dependency graph
        run: |
          if cargo tree --locked | grep -i tauri; then
            echo "gpg-core must not depend on any tauri crate"
            exit 1
          fi

  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: crates/gpg-core -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build for arm64-v8a
        # ubuntu-22.04 runners ship an Android NDK and export ANDROID_NDK_LATEST_HOME.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a build --release --locked

  ffi:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: crates/gpg-core-ffi
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: crates/gpg-core-ffi -> target

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: No UniFFI in gpg-core
        working-directory: crates/gpg-core
        run: |
          if cargo tree --locked | grep -i uniffi; then
            echo "gpg-core must not depend on uniffi"
            exit 1
          fi

      - name: Install Android NDK r28
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android libraries and Kotlin bindings
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./build-android.sh

      - name: Check linked libraries and page alignment
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for so in dist/jniLibs/*/libgpg_core_ffi.so; do
            echo "== $so"
            # Only Android system libraries may be linked.
            if "$READELF" -d "$so" | grep NEEDED | grep -vE 'lib(c|m|dl|log)\.so'; then
              echo "unexpected native dependency in $so"
              exit 1
            fi
            # Every LOAD segment must be 16 KB aligned.
            if "$READELF" -lW "$so" | awk '$1 == "LOAD" { print $NF }' | grep -v '^0x4000$'; then
              echo "$so is not 16 KB page-aligned"
              exit 1
            fi
          done
          test -f dist/kotlin/com/gpglocal/core/gpg_core_ffi.kt

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpg-core-ffi-dist
          path: crates/gpg-core-ffi/dist/
