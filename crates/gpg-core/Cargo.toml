[package]
name = "gpg-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false
description = "Tauri-free OpenPGP core shared by the GPG Local desktop and Android apps"

[lib]
crate-type = ["rlib"]

[features]
# Enables tests that shell out to the `gpg` CLI (run in CI: `-- interop`).
gpg-interop-tests = []

[dependencies]
# Feature set must stay identical to src-tauri/Cargo.toml so both builds produce the same output.
sequoia-openpgp = { version = "1", default-features = false, features = [
    "crypto-rust",
    "allow-experimental-crypto",
    "allow-variable-time-crypto",
    "compression",
    "compression-deflate",
    "compression-bzip2",
] }
anyhow = "1"
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1.0"
