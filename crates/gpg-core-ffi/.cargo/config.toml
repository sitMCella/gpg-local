# 16 KB page alignment (required on Android 15+ devices). NDK r28 already does
# this by default for arm64-v8a and x86_64, but not for armeabi-v7a or older NDKs.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
