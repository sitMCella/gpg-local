[package]
name = "gpg-core-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false
description = "UniFFI Kotlin bindings for gpg-core, used by the GPG Local Android app"

[lib]
name = "gpg_core_ffi"
crate-type = ["cdylib", "rlib"] # rlib so Rust unit tests can call the exports

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
gpg-core = { path = "../gpg-core" }
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
libc = "0.2"
# Only to build fixture certs in tests; feature set matches crates/gpg-core.
sequoia-openpgp = { version = "1", default-features = false, features = [
    "crypto-rust",
    "allow-experimental-crypto",
    "allow-variable-time-crypto",
    "compression",
    "compression-deflate",
    "compression-bzip2",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
